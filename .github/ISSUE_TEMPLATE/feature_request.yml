name: 💡 Feature Request
description: Suggest an idea or new rename action for File Renamer X.
title: "[Feature]: "
labels: ["type: feature", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature, rename action, or workflow improvement you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Workarounds
      description: Any alternative solutions or features you've considered.
